[package]
name = "rsauthnz-conformance"
version = "0.1.0-alpha.1"
description = "The storage conformance of rsauthnz: the memory binding of the storage contract, for tests and examples."
repository = "https://github.com/loadingalias/rsauthnz"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The storage contract that the memory binding implements.
rsauthnz = { version = "=0.1.0-alpha.1", path = ".." }
# The only source of hashes. The seeded fault schedule draws from RapidHash.
rscrypto = { git = "https://github.com/loadingalias/rscrypto", branch = "main", default-features = false, features = ["rapidhash"] }

[lints]
workspace = true
