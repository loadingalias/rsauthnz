[package]
name = "rsauthnz-conformance"
version = "0.1.0-alpha.1"
description = "The storage conformance of rsauthnz: the memory binding of the storage contract, for tests and examples."
repository = "https://github.com/loadingalias/rsauthnz"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The storage contract that the memory binding implements.
rsauthnz = { version = "=0.1.0-alpha.1", path = ".." }
# The only source of hashes and signatures. The seeded fault schedule draws from RapidHash. The cases of the local
# authority sign with composite keys in place of custody, and draw bootstrap values from ChaCha20.
rscrypto = { git = "https://github.com/loadingalias/rscrypto", branch = "main", default-features = false, features = ["chacha20-rng", "mldsa65-ed25519", "rapidhash"] }

[lints]
workspace = true
