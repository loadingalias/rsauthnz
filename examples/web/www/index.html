<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>rsauthnz web example</title>
<h1>rsauthnz web example</h1>
<p>The store is in memory: a restart of the server loses each account.</p>
<p id="status" role="status"></p>

<section id="signed-out">
  <h2>Sign in</h2>
  <form id="sign-in"><input name="username" autocomplete="username webauthn" placeholder="name"> <button>Sign in with a passkey</button></form>
  <h2>Sign up</h2>
  <form id="sign-up"><input name="name" required placeholder="name"> <button>Make a passkey</button></form>
  <h2>Activate an invitation</h2>
  <form id="activate"><input name="name" required placeholder="name"> <input name="invitation" required placeholder="invitation"> <button>Activate</button></form>
  <h2>Recover</h2>
  <form id="recover"><input name="name" required placeholder="name"> <input name="code" required placeholder="recovery code"> <button>Recover</button></form>
</section>

<section id="signed-in" hidden>
  <h2 id="account"></h2>
  <form id="rename"><input name="name" required placeholder="name"> <input name="displayName" required placeholder="display name"> <button>Rename the account</button></form>
  <h3>Passkeys</h3>
  <ul id="passkeys"></ul>
  <button id="add">Add a passkey</button>
  <h3>Sessions</h3>
  <ul id="sessions"></ul>
  <h3>Invite</h3>
  <form id="invite"><input name="name" required placeholder="name"> <button>Invite</button></form>
  <h3>Recovery code</h3>
  <button id="code">Make a new code</button>
  <p><button id="sign-out">Sign out</button></p>
</section>

<script type="module" src="/app.js"></script>
