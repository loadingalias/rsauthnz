\* Known-bad variant: a restore raises the store instance number of its snapshot.
\* The constants of Approval.cfg with two restores, so a number can repeat.
CONSTANTS
  Agents = {g1, g2}
  Descs = {d1, d2}
  Insts = {i1, i2}
  Nonces = {n1, n2, n3, n4}
  Ops = {o1, o2}
  MaxRev = 2
  MaxRestore = 2
  Bad = "none"
  None = None
  Restore <- SnapshotRestore
INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANT
  OutcomeOnce
