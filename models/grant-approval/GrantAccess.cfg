\* The declared profile: two agents, two operations, two values of each
\* symbol, two policy versions, two grant revisions of one permission each,
\* and one owner change. The model checks safety only, so a terminal state is
\* no failure.
CONSTANTS
  Agents = {g1, g2}
  Ops = {o1, o2}
  Auds = {a1, a2}
  Ress = {r1, r2}
  Acts = {x1, x2}
  NPol = 2
  MaxRev = 2
  MaxPerms = 1
  MaxOwn = 1
  Bad = "none"
  None = None
INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  RevokedNoAccess
  EffectiveAccess
  WithinGrant
