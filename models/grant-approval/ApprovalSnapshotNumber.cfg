\* The variant at the constants of Approval.cfg. One restore cannot show the
\* defect, so this profile must pass, with the state count of Approval.cfg.
CONSTANTS
  Agents = {g1, g2}
  Descs = {d1, d2}
  Insts = {i1, i2}
  Nonces = {n1, n2, n3, n4}
  Ops = {o1, o2}
  MaxRev = 2
  MaxRestore = 1
  Bad = "none"
  None = None
  Restore <- SnapshotRestore
INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  ApprovalBinding
  ApprovalOnce
  RestoreRejects
  OutcomeOnce
