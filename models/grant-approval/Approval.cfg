\* The declared profile: two agents, two descriptions, two approval
\* instances, four nonces (one for each request in two store instances), two
\* operations, two grant revisions, and one restore. The model checks safety
\* only, so a terminal state is no failure.
CONSTANTS
  Agents = {g1, g2}
  Descs = {d1, d2}
  Insts = {i1, i2}
  Nonces = {n1, n2, n3, n4}
  Ops = {o1, o2}
  MaxRev = 2
  MaxRestore = 1
  Bad = "none"
  None = None
INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  ApprovalBinding
  ApprovalOnce
  RestoreRejects
  OutcomeOnce
