\* Known-bad variant ackEarly: an acknowledgement before the creation entry of
\* another anchor commit of its owner. The fourth slot of a1 lets an
\* enrollment run beside an unlink in an account with two live anchors.
CONSTANTS
  Bad = "ackEarly"
  Turn = "creation"
  Raise = "slotsA1"
  Origin = "new"
INIT Init
NEXT Next
CONSTRAINT TwoOps
INVARIANTS
  AnchorKept
