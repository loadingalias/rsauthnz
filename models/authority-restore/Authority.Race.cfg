\* Every turn ends at the first journal write, so two consumptions of one
\* value can be in doubt at one restore. Two operations, counter values up to 4.
CONSTANTS
  Bad = "none"
  Turn = "entry"
  Raise = "none"
  Origin = "new"
INIT Init
NEXT Next
CONSTRAINT TwoOps
INVARIANTS
  TypeOK
  NothingEndedValid
  OneBootValid
  NoCounterReuse
  MissingOutcomeUnknown
  NoUncommittedAnchor
  AnchorKept
  AdminKeptP
  AccountKeepsAnchorP
  RefusalHolds
  OneUse
  PendExact
  NoDoubtServing
