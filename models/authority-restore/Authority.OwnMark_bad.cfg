\* Known-bad variant ownMark: the low-water mark counts only the entries of
\* account a1 and of the authority, so a snapshot that an unlink of a2 is in
\* flight for misses its end entry, and a restore makes the ended anchor valid
\* again. Two accounts are needed: under one account the mark is the full one.
CONSTANTS
  Bad = "ownMark"
  Turn = "creation"
  Raise = "none"
  Origin = "new"
INIT Init
NEXT Next
CONSTRAINT TwoOps
INVARIANTS
  NothingEndedValid
