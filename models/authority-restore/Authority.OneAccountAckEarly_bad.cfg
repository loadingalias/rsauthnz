\* Known-bad variant ackEarly (the design before 2026-11-08): an acknowledgement
\* of an anchor change does not wait for the creation entry of an earlier commit
\* on the same account. A restore then removes an anchor that the acknowledged
\* state held. Found by Authority.RaiseOpsOne.cfg; it needs a free slot in the
\* account, so it runs under the one-account reduction with two operations.
CONSTANTS
  Bad = "ackEarly"
  Turn = "creation"
  Raise = "oneAccount"
  Origin = "new"
INIT Init
NEXT Next
CONSTRAINT TwoOps
INVARIANTS
  AnchorKept
