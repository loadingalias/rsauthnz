\* The declared bounds, from an authority whose first bootstrap value is consumed:
\* two accounts (three anchor slots in a1, two in a2), the administrator slots, three operations, two snapshots, counter values up to 5, and at most
\* one owner re-bootstrap.
CONSTANTS
  A1P = A1P
  A1Q = A1Q
  A1R = A1R
  Anchors <- SymmetricAnchors
  Owner <- SymmetricOwner
  InitLive <- SymmetricInitLive
  Anc <- CachedAnc
  Protected <- CachedProtected
  TypeOK <- CachedTypeOK
  SnapOK <- CachedSnapOK
  NextEnroll <- CachedNextEnroll
  NextUnlink <- CachedNextUnlink
  NextRecover <- CachedNextRecover
  NextBoot <- CachedNextBoot
  NextRenew <- CachedNextRenew
  NextRevoke <- CachedNextRevoke
  NextIssueEnd <- CachedNextIssueEnd
  NextIssueNone <- CachedNextIssueNone
  Bad = "none"
  Turn = "creation"
  Raise = "none"
  Origin = "bootstrapped"
SYMMETRY AnchorSymmetry
INIT Init
NEXT Next
CONSTRAINT Declared
INVARIANTS
  TypeOK
  NothingEndedValid
  OneBootValid
  NoCounterReuse
  MissingOutcomeUnknown
  NoUncommittedAnchor
  AnchorKept
  AdminKeptP
  AccountKeepsAnchorP
  RefusalHolds
  OneUse
  PendExact
  NoDoubtServing
