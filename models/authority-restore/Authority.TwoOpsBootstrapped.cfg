\* The local cross-check from an authority whose first bootstrap value is
\* consumed: two operations of three, counter values up to 4, at most one
\* owner re-bootstrap.
CONSTANTS
  Bad = "none"
  Turn = "creation"
  Raise = "none"
  Origin = "bootstrapped"
INIT Init
NEXT Next
CONSTRAINT TwoOps
INVARIANTS
  TypeOK
  NothingEndedValid
  OneBootValid
  NoCounterReuse
  MissingOutcomeUnknown
  NoUncommittedAnchor
  AnchorKept
  AdminKeptP
  AccountKeepsAnchorP
  RefusalHolds
  OneUse
  PendExact
  NoDoubtServing
