\* The local cross-check from a new authority: two operations of three, counter
\* values up to 4, and at most one owner re-bootstrap.
CONSTANTS
  Bad = "none"
  Turn = "creation"
  Raise = "none"
  Origin = "new"
INIT Init
NEXT Next
CONSTRAINT TwoOps
INVARIANTS
  TypeOK
  NothingEndedValid
  OneBootValid
  NoCounterReuse
  MissingOutcomeUnknown
  NoUncommittedAnchor
  AnchorKept
  AdminKeptP
  AccountKeepsAnchorP
  RefusalHolds
  OneUse
  PendExact
  NoDoubtServing
