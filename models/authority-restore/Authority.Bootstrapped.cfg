  TypeOK
  NothingEndedValid
  OneBootValid
  NoCounterReuse
  MissingOutcomeUnknown
  NoUncommittedAnchor
  AnchorKept
  AdminKeptP
  AccountKeepsAnchorP
  RefusalHolds
  OneUse
  PendExact
  NoDoubtServing
