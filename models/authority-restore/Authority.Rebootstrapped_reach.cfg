\* Reachability witness: After the first bootstrap value was consumed, an owner re-bootstrap gives the
\* authority a new administrator.
\* Two operations, counter values up to 4.
CONSTANTS
  Bad = "none"
  Turn = "creation"
  Raise = "none"
  Origin = "bootstrapped"
INIT Init
NEXT Next
CONSTRAINT TwoOps
INVARIANTS
  NotRebootstrapped
