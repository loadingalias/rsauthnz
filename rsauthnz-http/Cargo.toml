[package]
name = "rsauthnz-http"
version = "0.1.0-alpha.1"
description = "The HTTP binding of rsauthnz on `http` 1.x values: origin and CSRF checks, cookies, JSON bodies, redirects, and safe error responses."
repository = "https://github.com/loadingalias/rsauthnz"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The request and response values of the frameworks that mount the binding, such as axum, hyper, and tower. A caret
# requirement lets an application unify `http` 1.x with its framework.
http = "1.5"
# The recovery of each outcome of a transition.
rsauthnz = { version = "=0.1.0-alpha.1", path = ".." }

[dev-dependencies]
# The memory binding and the effect executor commit the issue of the credential of the signature tests: only the
# receipt of an accepted transition gives its bytes.
rsauthnz-conformance = { version = "=0.1.0-alpha.1", path = "../rsauthnz-conformance" }
# The composite keys of the issuer and of the agent, which sign in place of custody in the signature tests.
rscrypto = { git = "https://github.com/loadingalias/rscrypto", branch = "main", default-features = false, features = ["mldsa65-ed25519"] }

[lints]
workspace = true
